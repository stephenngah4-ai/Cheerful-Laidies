<script>
const N="LIBOUM,NDOMO,LEYEBE,MEGONG,NGUESSU,ONGUENE,TAMESSE,GOLIKE,MEGOT,ESSOMO,MVONDO,YOUALEU,NDZANA,OWONA,KABEYENE,LETONO,DEULA,AGOUALOU,BISSONI,FOUMANE,WOBE,ANABA,MENGUE,WELDJE,WADJA,AVOMO ENAMA,MBALLA,ONAMBELE,FANSI,BELA,ATTOH,MEGNE,AKONO,OSSOUBITA,AKABA,OKALA,ESSONGA,BILONGO,NCHARE,MBASSI,IBALA,MBA KOUDOU,MEVA’A,NLATE,MPOT,ZE AYE,NANGA,YAYE,NDJAGA,NTOOGUE,FODOUOP,MINDUI,LONO MIASSE,ABENABE,BESSOLO,MEYONG,MENGUE,DJITABE".split(",");
const C=["Secours","Épargne A","Épargne scol.","Raf","Panier","Dével.","Prêts","Remb.","Anniv.","Aide","Savon","Retard"];
const MO="Janvier,Février,Mars,Avril,Mai,Juin,Juillet,Août,Septembre,Octobre,Novembre,Décembre".split(",");
const R=[["epa","Épargne annuelle",T=>T[1]],["esc","Épargne scolaire",T=>T[2]],["sec","Secours",T=>T[0]],["rem","Remboursement",T=>T[7]],["dev","Développement",T=>T[5]],["aut","Autres",T=>T[3]+T[4]+T[8]+T[9]+T[10]+T[11]],["pre","Total prêts",T=>T[6]],["tot","Total cotisations",T=>sum(T)-T[6]]];
const K="cl_bertoua_v1",$=s=>document.querySelector(s),A=$("#A"),p2=n=>String(n).padStart(2,"0");
const sum=a=>a.reduce((x,y)=>x+y,0),rt=r=>sum(r)-r[6],fmt=n=>Math.round(n).toLocaleString("fr-FR"),
esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ds=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
let S={pw:null,s:{}},cur=ds(new Date()),view="r",yr=new Date().getFullYear(),mo=new Date().getMonth(),db=null,tm,ok=false;
try{const x=JSON.parse(localStorage.getItem(K)||"{}");S.pw=x.pw||null;S.s=x.s||{}}catch(e){}
const H0="ced466ca59473883715138a742185e6a52f7e2ad3e14f5ec6191fef7520b4036",HS="253c88ea62df0e0707a171be1c4519d5dd6547bb7174e2d30f4e96244b1ff271";let dirty=false;
const stamp=()=>{const d=new Date(),z={timeZone:"Africa/Douala"};return"Bertoua, le "+d.toLocaleDateString("fr-FR",z)+" à "+d.toLocaleTimeString("fr-FR",{timeZone:"Africa/Douala",hour:"2-digit",minute:"2-digit"})};
const mk=()=>({chez:"",b:{a:"",b:"",c:"",d:"",p:""},v:N.map(()=>C.map(()=>0)),maj:0,lk:0,st:""});
const gs=d=>S.s[d]||(S.s[d]=mk());
const ct=a=>{const T=C.map(()=>0);a.forEach(s=>s.v.forEach(r=>r.forEach((x,i)=>T[i]+=x)));return T};
const ys=y=>Object.keys(S.s).filter(k=>k.startsWith(y+"-")).sort();
function st(m,c){const e=$("#st");e.textContent=m;e.className=c||""}
function persist(){try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){st("Erreur d’enregistrement","err");return false}}
function save(d){const s=S.s[d];s.maj=Date.now();if(!s.lk)s.st=stamp();clearTimeout(tm);tm=setTimeout(()=>{if(persist())st("Enregistré ✓");if(db)db.doc("seances/"+d).set(s).catch(()=>{});lkui()},300)}
async function h(t){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("stpg"+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return"p:"+t}}
async function unlock(){const pv=$("#pw").value;if(await h(pv)===(S.pw||await h("stpg2026"))||await h(pv.trim().toLowerCase())===HS){ok=true;$("#lock").style.display="none";$("#pw").value="";rn()}else $("#er").textContent="Mot de passe incorrect"}
function lock(){ok=false;$("#lock").style.display="flex";$("#er").textContent="";$("#pw").focus()}
function rc(T,p){return'<div class="g">'+R.map(([k,l,f])=>`<div class="k"><span>${l}</span><b id="${p}${k}">${fmt(f(T))}</b></div>`).join("")+"</div>"}
function upd(){const s=S.s[cur],T=ct(s?[s]:[]);T.forEach((x,j)=>{const e=$("#f"+j);if(e)e.textContent=fmt(x)});$("#tt").textContent=fmt(rt(T));R.forEach(([k,,f])=>{$("#r_"+k).textContent=fmt(f(T))})}
function rR(){const s=S.s[cur]||mk(),dt=new Date(cur+"T12:00:00");
let t=`<div class="card ih"><h2 style="margin:0 0 4px;font-size:15px">Réunion du jour : <input type="date" id="dt" value="${cur}"></h2><div class="dl" style="color:var(--mu);text-transform:capitalize">${dt.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>

<div class="card" style="padding:4px"><div class="w"><table><thead><tr><th>N°</th><th class="n">Noms</th>${C.map(c=>`<th>${c}</th>`).join("")}<th class="tt">Total</th></tr></thead><tbody>`;
N.forEach((n,i)=>{t+=`<tr><td>${i+1}</td><td class="n">${esc(n)}</td>${s.v[i].map((x,j)=>`<td><input type="number" inputmode="numeric" min="0" data-i="${i}" data-j="${j}" value="${x||""}"></td>`).join("")}<td class="tt" id="t${i}">${fmt(rt(s.v[i]))}</td></tr>`});
t+=`</tbody><tfoot><tr><td colspan="2">TOTAL</td>${C.map((c,j)=>`<td id="f${j}"></td>`).join("")}<td id="tt"></td></tr></tfoot></table></div></div>
<div class="card"><h2>Conclusion</h2>${rc(C.map(()=>0),"r_")}</div>
<div class="card"><h2>Bénéficiaires du jour</h2>${[["a","10 000"],["b","25 000"],["c","50 000"],["d","100 000"]].map(([k,v])=>`<label>Cotisation de ${v} F CFA<input data-f="${k}" value="${esc(s.b[k])}"></label>`).join("")}<label>Bénéficiaires panier<input data-f="p" value="${esc(s.b.p)}"></label></div>
<div class="card np" style="position:sticky;bottom:6px;z-index:5;box-shadow:0 3px 12px rgba(0,0,0,.2)"><div id="mf" style="display:none"><input id="mp" type="password" placeholder="Mot de passe de modification" autocomplete="off"> <button class="b" data-a="okm">Valider</button><span class="er" id="me"></span></div><button class="b" data-a="sv">Enregistrer</button><button class="b" data-a="mod" style="display:none">Modifier</button><button class="b s" data-a="fs">Plein écran</button><button class="b s" data-a="print">Imprimer / PDF</button><button class="b s" data-a="v" data-v="c">Calendrier</button></div>`;
A.innerHTML=t;upd();lkui()}
function rC(){const ms=ys(yr);
let t=`<div class="card"><h2><button class="b s" data-a="yp" data-n="-1">‹</button> Année ${yr} <button class="b s" data-a="yp" data-n="1">›</button></h2><div class="mg">`;
MO.forEach((m,i)=>{const k=ms.filter(d=>+d.slice(5,7)===i+1),T=ct(k.map(d=>S.s[d]));t+=`<button data-a="m" data-n="${i}" class="${i===mo?"on":""}"><b>${m}</b><small>${k.length} réunion(s)</small><small>${fmt(rt(T))} F</small></button>`});
